version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2-p2p-postgres
    environment:
      POSTGRES_DB: cs2p2p
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres123"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs2p2p"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cs2-network

  redis:
    image: redis:7-alpine
    container_name: cs2-p2p-redis
    command: ["redis-server", "--requirepass", "redis123"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cs2-network

  migrator:
    image: postgres:16-alpine
    container_name: cs2-p2p-migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: >
      sh -c '
        set -e;
        echo "[MIGRATOR] Applying database migrations...";
        for f in /migrations/*.sql; do
          echo "[MIGRATOR] >> $${f}";
          psql "postgres://postgres:postgres123@postgres:5432/cs2p2p?sslmode=disable" -v ON_ERROR_STOP=1 -f "$${f}";
        done;
        echo "[MIGRATOR] Migrations completed successfully!";
      '
    restart: "no"
    networks:
      - cs2-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2-p2p-api
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_DSN: postgres://postgres:postgres123@postgres:5432/cs2p2p?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      STEAM_API_KEY: ${STEAM_API_KEY}
      STEAM_CALLBACK_URL: ${STEAM_CALLBACK_URL:-http://localhost:8080/api/auth/steam/callback}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cs2-network

volumes:
  pgdata:
    driver: local

networks:
  cs2-network:
    driver: bridge
